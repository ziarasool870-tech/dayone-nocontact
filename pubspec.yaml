name: day_one_nocontact
description: "Day One: No Contact — breakup recovery companion. Streak tracking, journaling, SOS support, milestone cards."
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local-first data
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.1

  # Real Google Play Billing (products registered in Play Console)
  in_app_purchase: ^3.2.1

  # Share milestone cards
  share_plus: ^11.1.0

  # Encrypted backup export/import
  encrypt: ^5.0.3
  crypto: ^3.0.6
  file_picker: ^10.3.2

  # Android home-screen widget
  home_widget: ^0.8.0

  # Tappable crisis-helpline numbers (tel: links)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
