name: day_one_nocontact
description: "Day One: No Contact — breakup recovery companion. Streak tracking, journaling, SOS support, milestone cards."
publish_to: "none"
version: 1.0.12+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local-first data
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.1

  # Real Google Play Billing (products registered in Play Console)
  in_app_purchase: ^3.2.1

  # Share milestone cards
  share_plus: ^11.1.0

  # Encrypted backup export/import
  encrypt: ^5.0.3
  crypto: ^3.0.6
  file_picker: ^10.3.2

  # Android home-screen widget
  home_widget: ^0.8.0

  # Vault PIN: keystore-backed encrypted storage for the PIN hash + salt.
  # The raw PIN is never written anywhere.
  flutter_secure_storage: ^10.3.4

  # Tappable crisis-helpline numbers (tel: links)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4
  # Directly imported by widget tests (platform fakes).
  in_app_purchase_platform_interface: ^1.4.1
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora.ttf
          weight: 400
        - asset: assets/fonts/lora/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/lora/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/lora/Lora-Bold.ttf
          weight: 700
