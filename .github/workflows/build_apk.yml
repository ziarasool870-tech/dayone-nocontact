name: Build Day One APK

# Manual trigger only — run from the Actions tab or via API dispatch.
on:
  workflow_dispatch:
    inputs:
      pro_unlocked:
        description: 'PROTEST variant: force-unlock Pro (test only, never for users)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get

      # 100% local-first build — no cloud keys, no backend, no network URLs.
      - name: Build release APK
        run: |
          if [ "${{ inputs.pro_unlocked }}" = "true" ]; then
            flutter build apk --release --split-per-abi --dart-define=PRO_UNLOCKED=true
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayone-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
